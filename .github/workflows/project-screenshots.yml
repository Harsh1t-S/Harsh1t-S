name: Capture Project Screenshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/project-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live projects
        run: |
          mkdir -p assets/project-screenshots
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1,
            colorScheme: 'dark',
          });

          async function capture(url, output, enhance) {
            const page = await context.newPage();
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(7000);

            if (enhance) {
              try {
                await enhance(page);
              } catch (error) {
                console.log(`Optional interaction skipped for ${url}: ${error.message}`);
              }
            }

            await page.screenshot({ path: output, fullPage: false });
            console.log(`Captured ${url} -> ${output}`);
            await page.close();
          }

          await capture(
            'https://agent-aegis.vercel.app/',
            'assets/project-screenshots/aegis.png'
          );

          await capture(
            'https://depth-wizard.vercel.app/',
            'assets/project-screenshots/depthwizard.png',
            async (page) => {
              const demo = page.getByRole('button', { name: /load demo scene/i });
              if (await demo.count()) {
                await demo.first().click({ timeout: 5000 });
                await page.waitForTimeout(7000);
              }
            }
          );

          await browser.close();
          EOF
          node capture.mjs
          rm -f capture.mjs package.json package-lock.json

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/project-screenshots/*.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "Refresh live project screenshots"
          git push
