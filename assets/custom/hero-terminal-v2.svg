<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Harshit — backend and AI systems builder</title>
  <desc id="desc">A midnight terminal-style profile card showing Harshit's focus on reliable backend and AI systems, with Orbit, Aegis, and DepthWizard online.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080d"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".34"/>
      <stop offset="0.46" stop-color="#8b5cf6" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#334155" stroke-width="1" opacity=".22"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="390" rx="24"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .muted { fill: #7d8590; }
      .line { stroke-dasharray: 7 10; animation: travel 10s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .rise { opacity: 0; animation: rise .55s ease forwards; }
      .d1 { animation-delay: .12s; }
      .d2 { animation-delay: .3s; }
      .d3 { animation-delay: .48s; }
      @keyframes travel { to { stroke-dashoffset: -170; } }
      @keyframes pulse { 0%,100% { opacity: .42; } 50% { opacity: 1; } }
      @keyframes blink { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
      @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .line,.pulse,.blink,.rise { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="390" fill="url(#bg)"/>
    <rect width="1200" height="390" fill="url(#grid)"/>
    <circle cx="1015" cy="196" r="245" fill="url(#orb)"/>
    <path d="M0 1H1200" stroke="url(#accent)" stroke-width="3"/>

    <circle cx="28" cy="28" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="28" r="6" fill="#febc2e"/>
    <circle cx="68" cy="28" r="6" fill="#28c840"/>
    <text x="94" y="33" class="mono muted" font-size="12">~/harshit/status</text>
    <text x="1164" y="33" text-anchor="end" class="mono" fill="#a3e635" font-size="12">● ONLINE / IST</text>

    <g class="rise d1">
      <text x="58" y="105" class="mono" fill="#22d3ee" font-size="13" letter-spacing="3">SOFTWARE DEVELOPER</text>
      <text x="54" y="166" class="sans" fill="#f0f6fc" font-size="58" font-weight="750" letter-spacing="-2">HARSHIT</text>
      <text x="58" y="202" class="sans" fill="#c9d1d9" font-size="23">backend engineering × AI reliability × product craft</text>
      <text x="58" y="246" class="mono" fill="#7d8590" font-size="16">I build software that can explain what it did — and prove that it worked.</text>
    </g>

    <g transform="translate(58 285)" class="rise d2">
      <rect width="122" height="34" rx="17" fill="#22d3ee" opacity=".1" stroke="#22d3ee" stroke-opacity=".5"/>
      <text x="61" y="22" text-anchor="middle" class="mono" fill="#67e8f9" font-size="12">PYTHON</text>
      <rect x="134" width="142" height="34" rx="17" fill="#8b5cf6" opacity=".1" stroke="#8b5cf6" stroke-opacity=".55"/>
      <text x="205" y="22" text-anchor="middle" class="mono" fill="#c4b5fd" font-size="12">TYPESCRIPT</text>
      <rect x="288" width="126" height="34" rx="17" fill="#a3e635" opacity=".08" stroke="#a3e635" stroke-opacity=".45"/>
      <text x="351" y="22" text-anchor="middle" class="mono" fill="#bef264" font-size="12">FASTAPI</text>
      <rect x="426" width="144" height="34" rx="17" fill="#22d3ee" opacity=".08" stroke="#22d3ee" stroke-opacity=".4"/>
      <text x="498" y="22" text-anchor="middle" class="mono" fill="#67e8f9" font-size="12">POSTGRESQL</text>
    </g>

    <g transform="translate(775 82)" class="rise d3">
      <circle cx="165" cy="112" r="92" fill="none" stroke="#30363d" stroke-width="1"/>
      <circle cx="165" cy="112" r="63" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 7"/>
      <path class="line" d="M32 56C84 9 117 27 165 112S266 188 316 158" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".75"/>
      <path class="line" d="M46 186C102 170 108 119 165 112S248 44 303 58" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".5"/>
      <circle cx="165" cy="112" r="29" fill="#0d1117" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)"/>
      <text x="165" y="108" text-anchor="middle" class="mono" fill="#f0f6fc" font-size="13" font-weight="700">SHIP</text>
      <text x="165" y="124" text-anchor="middle" class="mono muted" font-size="9">WITH PROOF</text>

      <circle class="pulse" cx="32" cy="56" r="6" fill="#22d3ee" filter="url(#glow)"/>
      <text x="12" y="42" class="mono" fill="#67e8f9" font-size="11">ORBIT</text>
      <text x="12" y="76" class="mono muted" font-size="9">54 TESTS</text>

      <circle class="pulse" cx="303" cy="58" r="6" fill="#8b5cf6" filter="url(#glow)"/>
      <text x="280" y="42" class="mono" fill="#c4b5fd" font-size="11">AEGIS</text>
      <text x="272" y="78" class="mono muted" font-size="9">TRACE-GRADED</text>

      <circle class="pulse" cx="316" cy="158" r="6" fill="#a3e635" filter="url(#glow)"/>
      <text x="269" y="181" class="mono" fill="#bef264" font-size="11">DEPTHWIZARD</text>
      <text x="278" y="195" class="mono muted" font-size="9">GPU / CV</text>

      <circle class="pulse" cx="46" cy="186" r="6" fill="#22d3ee" filter="url(#glow)"/>
      <text x="12" y="210" class="mono" fill="#67e8f9" font-size="11">PRODUCT</text>
    </g>

    <text x="58" y="362" class="mono" fill="#3fb950" font-size="13">harshit@github:~$</text>
    <text x="195" y="362" class="mono" fill="#c9d1d9" font-size="13">build --break --observe --rebuild</text>
    <rect class="blink" x="476" y="349" width="8" height="16" rx="1" fill="#22d3ee"/>
    <text x="1142" y="362" text-anchor="end" class="mono muted" font-size="10">NO MAGIC. JUST INSTRUMENTATION.</text>
  </g>
  <rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#30363d"/>
</svg>
