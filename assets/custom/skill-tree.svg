<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Harshit developer skill tree</title>
  <desc id="desc">A custom RPG-style developer skill tree showing backend, AI systems, and engineering craft progression.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { stroke: #30363d; stroke-width: 3; fill: none; }
      .edge.live { stroke: #58a6ff; stroke-dasharray: 9 9; animation: dash 7s linear infinite; }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .done { stroke: #3fb950; }
      .active { stroke: #d29922; }
      .next { stroke: #8957e5; stroke-dasharray: 6 5; }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
      .xp { fill: #21262d; }
      @keyframes dash { to { stroke-dashoffset: -90; } }
      @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .edge.live,.pulse { animation:none; } }
    </style>
  </defs>

  <rect width="1200" height="510" rx="22" fill="url(#bg)"/>
  <rect x="10" y="10" width="1180" height="490" rx="18" fill="none" stroke="#30363d"/>

  <text x="42" y="50" class="sans" fill="#e6edf3" font-size="25" font-weight="700">Developer Skill Tree</text>
  <text x="42" y="77" class="mono" fill="#8b949e" font-size="13">class: builder  •  specialization: backend + AI systems  •  playstyle: learn by shipping</text>

  <rect x="475" y="100" width="250" height="64" rx="15" fill="url(#core)" opacity=".18" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="508" cy="132" r="7" fill="#58a6ff" class="pulse"/>
  <text x="530" y="128" class="sans" fill="#e6edf3" font-size="18" font-weight="700">BUILD REAL THINGS</text>
  <text x="530" y="148" class="mono" fill="#8b949e" font-size="11">core passive: curiosity + shipping</text>

  <path class="edge live" d="M600 164 C600 194 225 185 225 220"/>
  <path class="edge live" d="M600 164 L600 220"/>
  <path class="edge live" d="M600 164 C600 194 975 185 975 220"/>

  <rect x="95" y="220" width="260" height="52" rx="13" class="node active"/>
  <text x="225" y="242" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">BACKEND</text>
  <text x="225" y="260" text-anchor="middle" class="mono" fill="#d29922" font-size="10">ACTIVE PATH</text>

  <rect x="470" y="220" width="260" height="52" rx="13" class="node done"/>
  <text x="600" y="242" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">AI SYSTEMS</text>
  <text x="600" y="260" text-anchor="middle" class="mono" fill="#3fb950" font-size="10">UNLOCKED</text>

  <rect x="845" y="220" width="260" height="52" rx="13" class="node active"/>
  <text x="975" y="242" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">ENGINEERING CRAFT</text>
  <text x="975" y="260" text-anchor="middle" class="mono" fill="#d29922" font-size="10">LEVELING</text>

  <path class="edge" d="M225 272 C225 302 120 300 120 330"/>
  <path class="edge" d="M225 272 C225 302 305 300 305 330"/>
  <path class="edge" d="M600 272 C600 302 490 300 490 330"/>
  <path class="edge" d="M600 272 C600 302 675 300 675 330"/>
  <path class="edge" d="M975 272 C975 302 860 300 860 330"/>
  <path class="edge" d="M975 272 C975 302 1045 300 1045 330"/>

  <rect x="45" y="330" width="150" height="78" rx="12" class="node done"/>
  <text x="120" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">APIs</text>
  <text x="120" y="376" text-anchor="middle" class="mono" fill="#3fb950" font-size="9">FastAPI • Express</text>
  <rect x="68" y="392" width="104" height="5" rx="3" class="xp"/>
  <rect x="68" y="392" width="88" height="5" rx="3" fill="#3fb950"/>

  <rect x="230" y="330" width="150" height="78" rx="12" class="node active"/>
  <text x="305" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">Databases</text>
  <text x="305" y="376" text-anchor="middle" class="mono" fill="#d29922" font-size="9">Postgres • Prisma</text>
  <rect x="253" y="392" width="104" height="5" rx="3" class="xp"/>
  <rect x="253" y="392" width="72" height="5" rx="3" fill="#d29922"/>

  <rect x="415" y="330" width="150" height="78" rx="12" class="node done"/>
  <text x="490" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">RAG + Agents</text>
  <text x="490" y="376" text-anchor="middle" class="mono" fill="#3fb950" font-size="9">retrieval • evals</text>
  <rect x="438" y="392" width="104" height="5" rx="3" class="xp"/>
  <rect x="438" y="392" width="89" height="5" rx="3" fill="#3fb950"/>

  <rect x="600" y="330" width="150" height="78" rx="12" class="node active"/>
  <text x="675" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">Reliability</text>
  <text x="675" y="376" text-anchor="middle" class="mono" fill="#d29922" font-size="9">testing • evals</text>
  <rect x="623" y="392" width="104" height="5" rx="3" class="xp"/>
  <rect x="623" y="392" width="64" height="5" rx="3" fill="#d29922"/>

  <rect x="785" y="330" width="150" height="78" rx="12" class="node active"/>
  <text x="860" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">DSA</text>
  <text x="860" y="376" text-anchor="middle" class="mono" fill="#d29922" font-size="9">consistency buff</text>
  <rect x="808" y="392" width="104" height="5" rx="3" class="xp"/>
  <rect x="808" y="392" width="59" height="5" rx="3" fill="#d29922"/>

  <rect x="970" y="330" width="150" height="78" rx="12" class="node next"/>
  <text x="1045" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">System Design</text>
  <text x="1045" y="376" text-anchor="middle" class="mono" fill="#bc8cff" font-size="9">NEXT UNLOCK</text>
  <rect x="993" y="392" width="104" height="5" rx="3" class="xp"/>
  <rect x="993" y="392" width="24" height="5" rx="3" fill="#8957e5"/>

  <circle cx="62" cy="462" r="5" fill="#3fb950"/>
  <text x="74" y="466" class="mono" fill="#8b949e" font-size="10">unlocked</text>
  <circle cx="154" cy="462" r="5" fill="#d29922"/>
  <text x="166" y="466" class="mono" fill="#8b949e" font-size="10">leveling</text>
  <circle cx="249" cy="462" r="5" fill="#8957e5"/>
  <text x="261" y="466" class="mono" fill="#8b949e" font-size="10">next</text>
  <text x="1158" y="466" text-anchor="end" class="mono" fill="#484f58" font-size="10">build → break → debug → understand → rebuild</text>
</svg>