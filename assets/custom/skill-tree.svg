<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Harshit developer skill tree</title>
  <desc id="desc">A custom RPG-style developer skill tree showing backend, AI systems, and engineering craft progression.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { stroke: #30363d; stroke-width: 3; fill: none; }
      .edge.live { stroke: #58a6ff; stroke-dasharray: 9 9; animation: dash 7s linear infinite; }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .done { stroke: #3fb950; }
      .active { stroke: #d29922; }
      .next { stroke: #8957e5; stroke-dasharray: 6 5; }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
      .xp { fill: #21262d; }
      @keyframes dash { to { stroke-dashoffset: -90; } }
      @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .edge.live,.pulse { animation:none; } }
    </style>
  </defs>

  <rect width="1100" height="500" rx="22" fill="url(#bg)"/>
  <rect x="10" y="10" width="1080" height="480" rx="18" fill="none" stroke="#30363d"/>

  <text x="42" y="50" class="sans" fill="#e6edf3" font-size="25" font-weight="700">Developer Skill Tree</text>
  <text x="42" y="77" class="mono" fill="#8b949e" font-size="13">class: builder  •  specialization: backend + AI systems  •  playstyle: learn by shipping</text>

  <!-- core -->
  <rect x="425" y="100" width="250" height="64" rx="15" fill="url(#core)" opacity=".18" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="458" cy="132" r="7" fill="#58a6ff" class="pulse"/>
  <text x="480" y="128" class="sans" fill="#e6edf3" font-size="18" font-weight="700">BUILD REAL THINGS</text>
  <text x="480" y="148" class="mono" fill="#8b949e" font-size="11">core passive: curiosity + shipping</text>

  <!-- core to branches -->
  <path class="edge live" d="M550 164 C550 195 185 183 185 220"/>
  <path class="edge live" d="M550 164 L550 220"/>
  <path class="edge live" d="M550 164 C550 195 915 183 915 220"/>

  <!-- branch headers -->
  <rect x="55" y="220" width="260" height="52" rx="13" class="node active"/>
  <text x="185" y="242" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">BACKEND</text>
  <text x="185" y="260" text-anchor="middle" class="mono" fill="#d29922" font-size="10">ACTIVE PATH</text>

  <rect x="420" y="220" width="260" height="52" rx="13" class="node done"/>
  <text x="550" y="242" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">AI SYSTEMS</text>
  <text x="550" y="260" text-anchor="middle" class="mono" fill="#3fb950" font-size="10">UNLOCKED</text>

  <rect x="785" y="220" width="260" height="52" rx="13" class="node active"/>
  <text x="915" y="242" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">ENGINEERING CRAFT</text>
  <text x="915" y="260" text-anchor="middle" class="mono" fill="#d29922" font-size="10">LEVELING</text>

  <!-- branch connectors -->
  <path class="edge" d="M185 272 C185 305 110 302 110 330"/>
  <path class="edge" d="M185 272 C185 305 260 302 260 330"/>
  <path class="edge" d="M550 272 C550 305 475 302 475 330"/>
  <path class="edge" d="M550 272 C550 305 625 302 625 330"/>
  <path class="edge" d="M915 272 C915 305 840 302 840 330"/>
  <path class="edge" d="M915 272 C915 305 990 302 990 330"/>

  <!-- backend leaves -->
  <rect x="35" y="330" width="150" height="76" rx="12" class="node done"/>
  <text x="110" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">APIs</text>
  <text x="110" y="376" text-anchor="middle" class="mono" fill="#3fb950" font-size="10">FastAPI • Express</text>
  <rect x="58" y="389" width="104" height="5" rx="3" class="xp"/>
  <rect x="58" y="389" width="88" height="5" rx="3" fill="#3fb950"/>

  <rect x="200" y="330" width="150" height="76" rx="12" class="node active"/>
  <text x="275" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">Databases</text>
  <text x="275" y="376" text-anchor="middle" class="mono" fill="#d29922" font-size="10">Postgres • Prisma</text>
  <rect x="223" y="389" width="104" height="5" rx="3" class="xp"/>
  <rect x="223" y="389" width="72" height="5" rx="3" fill="#d29922"/>

  <!-- AI leaves -->
  <rect x="400" y="330" width="150" height="76" rx="12" class="node done"/>
  <text x="475" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">RAG + Agents</text>
  <text x="475" y="376" text-anchor="middle" class="mono" fill="#3fb950" font-size="10">retrieval • evals</text>
  <rect x="423" y="389" width="104" height="5" rx="3" class="xp"/>
  <rect x="423" y="389" width="89" height="5" rx="3" fill="#3fb950"/>

  <rect x="565" y="330" width="150" height="76" rx="12" class="node active"/>
  <text x="640" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">Reliability</text>
  <text x="640" y="376" text-anchor="middle" class="mono" fill="#d29922" font-size="10">testing • evals</text>
  <rect x="588" y="389" width="104" height="5" rx="3" class="xp"/>
  <rect x="588" y="389" width="64" height="5" rx="3" fill="#d29922"/>

  <!-- craft leaves -->
  <rect x="765" y="330" width="150" height="76" rx="12" class="node active"/>
  <text x="840" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">DSA</text>
  <text x="840" y="376" text-anchor="middle" class="mono" fill="#d29922" font-size="10">consistency buff</text>
  <rect x="788" y="389" width="104" height="5" rx="3" class="xp"/>
  <rect x="788" y="389" width="59" height="5" rx="3" fill="#d29922"/>

  <rect x="930" y="330" width="150" height="76" rx="12" class="node next"/>
  <text x="1005" y="356" text-anchor="middle" class="sans" fill="#e6edf3" font-size="14" font-weight="700">System Design</text>
  <text x="1005" y="376" text-anchor="middle" class="mono" fill="#bc8cff" font-size="10">NEXT UNLOCK</text>
  <rect x="953" y="389" width="104" height="5" rx="3" class="xp"/>
  <rect x="953" y="389" width="24" height="5" rx="3" fill="#8957e5"/>

  <!-- footer -->
  <circle cx="62" cy="457" r="5" fill="#3fb950"/>
  <text x="74" y="461" class="mono" fill="#8b949e" font-size="10">unlocked</text>
  <circle cx="154" cy="457" r="5" fill="#d29922"/>
  <text x="166" y="461" class="mono" fill="#8b949e" font-size="10">leveling</text>
  <circle cx="249" cy="457" r="5" fill="#8957e5"/>
  <text x="261" y="461" class="mono" fill="#8b949e" font-size="10">next</text>

  <text x="1058" y="461" text-anchor="end" class="mono" fill="#484f58" font-size="10">build → break → debug → understand → rebuild</text>
</svg>