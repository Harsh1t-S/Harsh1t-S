<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Harshit developer skill tree</title>
  <desc id="desc">A custom RPG-style developer skill tree showing backend, AI systems, and engineering craft progression.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .edge { stroke: #30363d; stroke-width: 3; fill: none; }
      .edge.live { stroke: #58a6ff; stroke-dasharray: 9 9; animation: dash 7s linear infinite; }
      .node { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .done { stroke: #3fb950; }
      .active { stroke: #d29922; }
      .next { stroke: #8957e5; stroke-dasharray: 6 5; }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
      .xp { fill: #21262d; }
      @keyframes dash { to { stroke-dashoffset: -90; } }
      @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .edge.live,.pulse { animation:none; } }
    </style>
  </defs>

  <rect width="1200" height="650" rx="22" fill="url(#bg)"/>
  <rect x="10" y="10" width="1180" height="630" rx="18" fill="none" stroke="#30363d"/>

  <text x="42" y="50" class="sans" fill="#e6edf3" font-size="25" font-weight="700">Developer Skill Tree</text>
  <text x="42" y="77" class="mono" fill="#8b949e" font-size="13">class: builder  •  specialization: backend + AI systems  •  playstyle: learn by shipping</text>

  <rect x="475" y="100" width="250" height="64" rx="15" fill="url(#core)" opacity=".18" stroke="#58a6ff" stroke-width="2" filter="url(#glow)"/>
  <circle cx="508" cy="132" r="7" fill="#58a6ff" class="pulse"/>
  <text x="530" y="128" class="sans" fill="#e6edf3" font-size="18" font-weight="700">BUILD REAL THINGS</text>
  <text x="530" y="148" class="mono" fill="#8b949e" font-size="11">core passive: curiosity + shipping</text>

  <path class="edge live" d="M600 164 C600 196 205 190 205 225"/>
  <path class="edge live" d="M600 164 L600 225"/>
  <path class="edge live" d="M600 164 C600 196 995 190 995 225"/>

  <rect x="75" y="225" width="260" height="54" rx="13" class="node active"/>
  <text x="205" y="248" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">BACKEND</text>
  <text x="205" y="266" text-anchor="middle" class="mono" fill="#d29922" font-size="10">ACTIVE PATH</text>

  <rect x="470" y="225" width="260" height="54" rx="13" class="node done"/>
  <text x="600" y="248" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">AI SYSTEMS</text>
  <text x="600" y="266" text-anchor="middle" class="mono" fill="#3fb950" font-size="10">UNLOCKED</text>

  <rect x="865" y="225" width="260" height="54" rx="13" class="node active"/>
  <text x="995" y="248" text-anchor="middle" class="sans" fill="#e6edf3" font-size="16" font-weight="700">ENGINEERING CRAFT</text>
  <text x="995" y="266" text-anchor="middle" class="mono" fill="#d29922" font-size="10">LEVELING</text>

  <!-- vertical branch trunks -->
  <path class="edge" d="M205 279 L205 545"/>
  <path class="edge" d="M600 279 L600 545"/>
  <path class="edge" d="M995 279 L995 545"/>

  <!-- backend skills -->
  <rect x="75" y="320" width="260" height="86" rx="12" class="node done"/>
  <text x="205" y="348" text-anchor="middle" class="sans" fill="#e6edf3" font-size="15" font-weight="700">APIs</text>
  <text x="205" y="369" text-anchor="middle" class="mono" fill="#3fb950" font-size="10">FastAPI • Express</text>
  <rect x="125" y="386" width="160" height="6" rx="3" class="xp"/>
  <rect x="125" y="386" width="136" height="6" rx="3" fill="#3fb950"/>

  <rect x="75" y="445" width="260" height="86" rx="12" class="node active"/>
  <text x="205" y="473" text-anchor="middle" class="sans" fill="#e6edf3" font-size="15" font-weight="700">Databases</text>
  <text x="205" y="494" text-anchor="middle" class="mono" fill="#d29922" font-size="10">PostgreSQL • Prisma</text>
  <rect x="125" y="511" width="160" height="6" rx="3" class="xp"/>
  <rect x="125" y="511" width="112" height="6" rx="3" fill="#d29922"/>

  <!-- AI skills -->
  <rect x="470" y="320" width="260" height="86" rx="12" class="node done"/>
  <text x="600" y="348" text-anchor="middle" class="sans" fill="#e6edf3" font-size="15" font-weight="700">RAG + Agents</text>
  <text x="600" y="369" text-anchor="middle" class="mono" fill="#3fb950" font-size="10">retrieval • orchestration • evals</text>
  <rect x="520" y="386" width="160" height="6" rx="3" class="xp"/>
  <rect x="520" y="386" width="137" height="6" rx="3" fill="#3fb950"/>

  <rect x="470" y="445" width="260" height="86" rx="12" class="node active"/>
  <text x="600" y="473" text-anchor="middle" class="sans" fill="#e6edf3" font-size="15" font-weight="700">Reliability</text>
  <text x="600" y="494" text-anchor="middle" class="mono" fill="#d29922" font-size="10">testing • evaluation • observability</text>
  <rect x="520" y="511" width="160" height="6" rx="3" class="xp"/>
  <rect x="520" y="511" width="101" height="6" rx="3" fill="#d29922"/>

  <!-- engineering craft skills -->
  <rect x="865" y="320" width="260" height="86" rx="12" class="node active"/>
  <text x="995" y="348" text-anchor="middle" class="sans" fill="#e6edf3" font-size="15" font-weight="700">DSA</text>
  <text x="995" y="369" text-anchor="middle" class="mono" fill="#d29922" font-size="10">consistency buff</text>
  <rect x="915" y="386" width="160" height="6" rx="3" class="xp"/>
  <rect x="915" y="386" width="91" height="6" rx="3" fill="#d29922"/>

  <rect x="865" y="445" width="260" height="86" rx="12" class="node next"/>
  <text x="995" y="473" text-anchor="middle" class="sans" fill="#e6edf3" font-size="15" font-weight="700">System Design</text>
  <text x="995" y="494" text-anchor="middle" class="mono" fill="#bc8cff" font-size="10">NEXT UNLOCK</text>
  <rect x="915" y="511" width="160" height="6" rx="3" class="xp"/>
  <rect x="915" y="511" width="38" height="6" rx="3" fill="#8957e5"/>

  <!-- connectors into cards -->
  <path class="edge" d="M205 305 L205 320"/>
  <path class="edge" d="M205 406 L205 445"/>
  <path class="edge" d="M600 305 L600 320"/>
  <path class="edge" d="M600 406 L600 445"/>
  <path class="edge" d="M995 305 L995 320"/>
  <path class="edge" d="M995 406 L995 445"/>

  <circle cx="62" cy="594" r="5" fill="#3fb950"/>
  <text x="74" y="598" class="mono" fill="#8b949e" font-size="10">unlocked</text>
  <circle cx="154" cy="594" r="5" fill="#d29922"/>
  <text x="166" y="598" class="mono" fill="#8b949e" font-size="10">leveling</text>
  <circle cx="249" cy="594" r="5" fill="#8957e5"/>
  <text x="261" y="598" class="mono" fill="#8b949e" font-size="10">next</text>
  <text x="1158" y="598" text-anchor="end" class="mono" fill="#484f58" font-size="10">build → break → debug → understand → rebuild</text>
</svg>